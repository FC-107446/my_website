<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Simple Platformer</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10152b; color: #fff; font: 16px system-ui, sans-serif; }
		.wrap { width: min(1200px, 100%); padding: 14px; text-align: center; }
		h1 { margin: 0 0 8px; font-size: 1.4rem; }
		canvas { display: block; width: 100%; height: auto; border: 3px solid #fff; border-radius: 10px; background: #78c9ed; image-rendering: pixelated; image-rendering: crisp-edges; }
		p { margin: 8px 0 0; color: #cbd5ff; }
		.home-link { display: inline-block; margin-bottom: 10px; padding: 8px 14px; border-radius: 6px; background: #fff; color: #10152b; font-weight: 700; text-decoration: none; }
		.home-link:hover { background: #dfe7ff; }
	</style>
</head>
<body>
	<main class="wrap">
		<a class="home-link" href="index.html">← Back to Home</a>
		<h1>Skybound</h1>
		<canvas id="game" width="1200" height="650" aria-label="Platformer game"></canvas>
		<p>Move: A/D or ←/→ &nbsp; Jump: W, ↑, or Space &nbsp; Restart: R</p>
	</main>
	<script>
		const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
		ctx.imageSmoothingEnabled = false;
		const W = canvas.width, H = canvas.height;
		const keys = {};
		let jumpPressed = false;
		addEventListener('keydown', e => { const key=e.key.toLowerCase(); if (!e.repeat && ['w','arrowup',' '].includes(key)) jumpPressed=true; keys[key] = true; if (['arrowleft','arrowright','arrowup',' '].includes(key)) e.preventDefault(); if (key === 'r') reset(); });
		addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
		const levels = [{name:'Cloud Circuit', worldWidth:1600, platforms:[
				{x:0,y:450,w:1600,h:50},{x:80,y:360,w:140,h:18},{x:250,y:290,w:120,h:18},{x:480,y:360,w:120,h:18},
				{x:335,y:150,w:125,h:18},{x:125,y:225,w:120,h:18},{x:900,y:365,w:145,h:18},{x:1090,y:285,w:150,h:18},{x:1300,y:200,w:150,h:18},{x:1450,y:320,w:50,h:18}],
			goal:{x:1360,y:30,w:28,h:55},
				coins:[{x:150,y:190},{x:370,y:270},{x:580,y:355},{x:755,y:280},{x:625,y:175},{x:970,y:330},{x:1160,y:250},{x:1380,y:160}],
				enemies:[{x:180,y:328,w:28,h:42,min:100,max:220,speed:1.2},{x:545,y:348,w:28,h:42,min:520,max:620,speed:1},{x:930,y:323,w:28,h:42,min:900,max:1015,speed:1.2},{x:1120,y:243,w:28,h:42,min:1090,max:1220,speed:1}]},
			{name:'Sunset Lift', worldWidth:2100, platforms:[
				{x:0,y:450,w:2100,h:50},{x:70,y:350,w:140,h:18},{x:260,y:410,w:120,h:18},{x:420,y:300,w:150,h:18},
				{x:650,y:365,w:170,h:18},{x:710,y:220,w:120,h:18},{x:500,y:175,w:130,h:18},{x:250,y:190,w:120,h:18},{x:900,y:350,w:150,h:18},{x:1100,y:285,w:150,h:18},{x:1300,y:210,w:150,h:18}],goal:{x:535,y:90,w:28,h:55},
				coins:[{x:130,y:315},{x:315,y:375},{x:485,y:265},{x:750,y:330},{x:560,y:110},{x:930,y:330},{x:1140,y:250},{x:1380,y:160}], enemies:[{x:90,y:308,w:28,h:42,min:70,max:180,speed:1.5},{x:680,y:323,w:28,h:42,min:650,max:790,speed:1.3},{x:280,y:148,w:28,h:42,min:250,max:350,speed:1},{x:900,y:408,w:28,h:42,min:850,max:1010,speed:1.2},{x:1120,y:243,w:28,h:42,min:1090,max:1230,speed:1}]}
			,{name:'Starfall Heights', worldWidth:2400, platforms:[
				{x:0,y:450,w:2400,h:50},{x:80,y:365,w:135,h:18},{x:280,y:300,w:130,h:18},{x:475,y:380,w:125,h:18},
				{x:620,y:285,w:140,h:18},{x:820,y:355,w:130,h:18},{x:980,y:245,w:135,h:18},{x:1170,y:330,w:130,h:18},
				{x:1320,y:220,w:140,h:18},{x:1510,y:300,w:130,h:18},{x:1640,y:180,w:160,h:18}],goal:{x:1700,y:125,w:28,h:55},
				coins:[{x:145,y:330},{x:345,y:265},{x:535,y:345},{x:690,y:250},{x:885,y:320},{x:1045,y:210},{x:1235,y:295},{x:1385,y:185},{x:1575,y:265},{x:1730,y:145}], enemies:[{x:105,y:323,w:28,h:42,min:80,max:185,speed:1.2},{x:640,y:243,w:28,h:42,min:620,max:730,speed:1.1},{x:840,y:313,w:28,h:42,min:820,max:920,speed:1.4},{x:1190,y:288,w:28,h:42,min:1170,max:1270,speed:1.1},{x:1530,y:258,w:28,h:42,min:1510,max:1610,speed:1.3}]}
		];
		// These marked platforms are solid on every side, so the player cannot jump through them.
		levels[0].platforms.push({x:805,y:245,w:120,h:18,solid:true},{x:1180,y:170,w:100,h:18,solid:true},{x:1290,y:125,w:110,h:18,solid:true},{x:1330,y:85,w:110,h:18,solid:true});
		levels[0].goal={x:1360,y:30,w:28,h:55};
		levels[0].platforms.push({x:650,y:255,w:105,h:18,moving:{axis:'x',range:75,speed:.035}} ,{x:1000,y:190,w:105,h:18,moving:{axis:'y',range:55,speed:.028,phase:1.5}});
		levels[1].platforms.push({x:820,y:270,w:110,h:18,solid:true},{x:1020,y:175,w:100,h:18,solid:true},{x:500,y:70,w:130,h:18,solid:true});
		levels[1].goal={x:535,y:15,w:28,h:55};
		levels[1].platforms.push({x:390,y:220,w:105,h:18,moving:{axis:'x',range:80,speed:.03,phase:2}},{x:1220,y:180,w:105,h:18,moving:{axis:'y',range:60,speed:.025}});
		levels[2].platforms.push({x:760,y:165,w:110,h:18,solid:true},{x:1110,y:150,w:100,h:18,solid:true},{x:1460,y:125,w:100,h:18,solid:true},{x:1650,y:75,w:150,h:18,solid:true});
		levels[2].goal={x:1700,y:20,w:28,h:55};
		levels[2].platforms.push({x:600,y:190,w:105,h:18,moving:{axis:'x',range:85,speed:.032,phase:1}},{x:1250,y:150,w:105,h:18,moving:{axis:'y',range:65,speed:.026,phase:2.5}});
		let platforms, goal, coinSpots, enemies, chasers, bouncers, player, camera, won, coins, particles, level, spawnGrace;

		function reset() { level=0; won=false; loadLevel(); }
		function loadLevel() { 
			const data = levels[level];
			platforms = data.platforms.map(p => ({...p, baseX:p.x, baseY:p.y, t:p.moving?.phase||0}));
			goal = data.goal;
			coinSpots = data.coins;
			enemies = data.enemies.map(e => ({...e, dir:1}));

			bouncers = [
				{x:220 + level * 80, y:110, w:28, h:28, vx:2.4, vy:2.1},
				{x:620 + level * 60, y:80, w:28, h:28, vx:-2.1, vy:2.6},
				{x:1050 + level * 50, y:150, w:28, h:28, vx:2.8, vy:-2.2}
			];

			chasers = [
				{x:700 + level * 120, y:260, w:30, h:42, speed:0.3}
			];

			player={x:40,y:408,w:28,h:42,vx:0,vy:0,onGround:true};
			// Give the player a moment to leave the spawn point before hazards can
			// trigger another reload. This also prevents a reload loop after a hit.
			spawnGrace=90;
			camera=0;
			coins=coinSpots.map(c=>({...c,got:false}));
			particles=[];
		}
		function respawnPlayer() {
			player.x=40;
			player.y=408;
			player.vx=0;
			player.vy=0;
			player.onGround=true;
			spawnGrace=90;
			camera=0;
		}
		reset();
		function hit(a,b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
		function update() {
			if (won) return;
			if (spawnGrace > 0) spawnGrace--;
			const left=keys['a']||keys['arrowleft'], right=keys['d']||keys['arrowright'];
			const carried = player.onGround && platforms.find(p=>Math.abs(player.y+player.h-p.y)<1 && player.x+player.w>p.x && player.x<p.x+p.w);
			for (const p of platforms) if (p.moving) {
				const oldX=p.x, oldY=p.y;
				p.t += p.moving.speed;
				p.x = p.baseX + (p.moving.axis==='x' ? Math.sin(p.t)*p.moving.range : 0);
				p.y = p.baseY + (p.moving.axis==='y' ? Math.sin(p.t)*p.moving.range : 0);
				if (p===carried) { player.x += p.x-oldX; player.y += p.y-oldY; }
			}
			player.vx = (right-left)*4.4; player.vy += .55; if (player.vy > 14) player.vy=14;
			if (jumpPressed && player.onGround) { player.vy=-11; player.onGround=false; }
			jumpPressed=false;
			const oldX=player.x, oldY=player.y, oldBottom=player.y+player.h;
			player.x += player.vx; player.x=Math.max(0,Math.min(levels[level].worldWidth-player.w,player.x));
			player.y += player.vy; player.onGround=false;
			for (const p of platforms) if (player.vy>=0 && oldBottom<=p.y && player.y+player.h>=p.y && player.x+player.w>p.x && player.x<p.x+p.w) { player.y=p.y-player.h; player.vy=0; player.onGround=true; }
			for (const p of platforms) if (p.solid && hit(player,p)) {
				if (oldBottom<=p.y && player.vy>=0) { player.y=p.y-player.h; player.vy=0; player.onGround=true; }
				else if (oldY>=p.y+p.h && player.vy<0) { player.y=p.y+p.h; player.vy=0; }
				else if (oldX+player.w<=p.x && player.vx>0) player.x=p.x-player.w;
				else if (oldX>=p.x+p.w && player.vx<0) player.x=p.x+p.w;
			}
			for (const c of chasers) {
				const direction = Math.sign(player.x - c.x);
				c.x += direction * c.speed;
				c.x = Math.max(0, Math.min(levels[level].worldWidth - c.w, c.x));
			}

			for (const e of enemies) {
				e.x += e.speed * e.dir;
				if (e.x<e.min || e.x+e.w>e.max) e.dir*=-1;

				if (spawnGrace === 0 && hit(player,e)) {
					if (player.vy>0 && player.y+player.h-e.y<18) {
						e.dead=true;
						player.vy=-8;
					} else {
						respawnPlayer();
						return;
					}
				}
			}
			enemies=enemies.filter(e=>!e.dead);

			for (const b of bouncers) {
				b.x += b.vx;
				b.y += b.vy;

				if (b.x <= 0 || b.x + b.w >= levels[level].worldWidth) {
					b.vx *= -1;
					b.x = Math.max(0, Math.min(levels[level].worldWidth - b.w, b.x));
				}
				if (b.y <= 75 || b.y + b.h >= 430) {
					b.vy *= -1;
					b.y = Math.max(75, Math.min(430 - b.h, b.y));
				}

				if (spawnGrace === 0 && hit(player, b)) {
					respawnPlayer();
					return;
				}
			}

			for (const c of chasers) if (spawnGrace === 0 && hit(player, c)) {
				respawnPlayer();
				return;
			}

			for (const c of coins) if (!c.got && Math.hypot(player.x+14-c.x,player.y+20-c.y)<27) { c.got=true; for(let i=0;i<8;i++) particles.push({x:c.x,y:c.y,vx:(Math.random()-.5)*4,vy:-Math.random()*4,life:25}); }
			if (hit(player,goal) && coins.every(c=>c.got)) { if (level<levels.length-1) { level++; loadLevel(); return; } won=true; }
			if (player.y>H+60) { respawnPlayer(); return; }
			camera += (player.x-300-camera)*.08; camera=Math.max(0,Math.min(levels[level].worldWidth-W,camera));
			particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--;}); particles=particles.filter(p=>p.life>0);
		}
		function draw() {
			const skyCamera = Math.round(camera * 0.25);
			const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#72c8ed'); sky.addColorStop(1,'#d2f2dc'); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
			ctx.fillStyle='rgba(255,255,255,.55)'; for(let i=0;i<7;i++){ const x=((i*190-skyCamera)%1050)-100; ctx.beginPath();ctx.arc(x,80+i%3*55,25,0,7);ctx.arc(x+28,80+i%3*55,35,0,7);ctx.arc(x+65,80+i%3*55,24,0,7);ctx.fill(); }
			ctx.save(); ctx.translate(-Math.round(camera),0);
			platforms.forEach(p=>{ctx.fillStyle=p.solid?'#8a4fbd':p.moving?'#286b82':'#4b315f';ctx.fillRect(Math.round(p.x),Math.round(p.y),p.w,p.h);ctx.fillStyle=p.solid?'#d08cff':p.moving?'#63e0df':'#6bd36b';ctx.fillRect(Math.round(p.x),Math.round(p.y),p.w,6);});
			ctx.fillStyle='#ffd84d'; ctx.fillRect(Math.round(goal.x),Math.round(goal.y),goal.w,goal.h); ctx.fillStyle='#ef476f'; ctx.beginPath();ctx.moveTo(Math.round(goal.x)+goal.w,Math.round(goal.y));ctx.lineTo(Math.round(goal.x)+goal.w+38,Math.round(goal.y)+13);ctx.lineTo(Math.round(goal.x)+goal.w,Math.round(goal.y)+26);ctx.fill();
			coins.forEach(c=>{if(!c.got){const x=Math.round(c.x),y=Math.round(c.y);ctx.fillStyle='#ffcf33';ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?5:11;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.fillStyle='#fff3a3';ctx.beginPath();ctx.arc(x-2,y-3,2,0,7);ctx.fill();}});
			enemies.forEach(e=>{
				ctx.fillStyle='#7b2cbf';
				ctx.fillRect(Math.round(e.x),Math.round(e.y),e.w,e.h);
				ctx.fillStyle='#ffdf6b';
				ctx.fillRect(Math.round(e.x)+5,Math.round(e.y)+9,6,6);
				ctx.fillRect(Math.round(e.x)+17,Math.round(e.y)+9,6,6);
				ctx.fillStyle='#32134f';
				ctx.fillRect(Math.round(e.x)+7,Math.round(e.y)+11,3,3);
				ctx.fillRect(Math.round(e.x)+19,Math.round(e.y)+11,3,3);
			});

			bouncers.forEach(b=>{
				const x=Math.round(b.x), y=Math.round(b.y);
				ctx.fillStyle='#168cff';
				ctx.beginPath();
				ctx.arc(x+b.w/2,y+b.h/2,b.w/2,0,Math.PI*2);
				ctx.fill();
				ctx.fillStyle='#9ed8ff';
				ctx.fillRect(x+7,y+7,5,5);
				ctx.fillRect(x+17,y+7,5,5);
				ctx.fillStyle='#063b75';
				ctx.fillRect(x+9,y+9,2,2);
				ctx.fillRect(x+19,y+9,2,2);
			});

			chasers.forEach(c => {
				const x = Math.round(c.x);
				const y = Math.round(c.y);

				ctx.fillStyle = '#ff4fa3';
				ctx.fillRect(x, y, c.w, c.h);

				ctx.fillStyle = '#ffd1e8';
				ctx.fillRect(x + 5, y + 9, 6, 6);
				ctx.fillRect(x + 19, y + 9, 6, 6);

				ctx.fillStyle = '#7a164b';
				ctx.fillRect(x + 7, y + 11, 3, 3);
				ctx.fillRect(x + 21, y + 11, 3, 3);
			});

			const px = Math.round(player.x), py = Math.round(player.y);
			ctx.fillStyle='#ef476f';ctx.fillRect(px,py,player.w,player.h); ctx.fillStyle='#fff';ctx.fillRect(px+17,py+9,5,5); ctx.fillStyle='#38264c';ctx.fillRect(px+20,py+10,2,2);
			ctx.restore();
			const currentLevel = levels[level];
			ctx.fillStyle='rgba(16,21,43,.62)'; ctx.fillRect(16,16,310,52); ctx.fillStyle='#fff'; ctx.font='bold 16px system-ui'; ctx.fillText(`Level ${level+1} / ${levels.length}`, 28, 37);
			ctx.font='bold 20px system-ui'; ctx.fillText(currentLevel.name, 28, 58);
			ctx.font='bold 18px system-ui'; ctx.fillStyle='#dfe7ff'; ctx.fillText(`Stars: ${coins.filter(c=>c.got).length}/${coins.length}`, 560, 30);
			if(won){ctx.fillStyle='rgba(16,21,43,.82)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px system-ui';ctx.fillText('You win!',W/2,H/2-15);ctx.font='18px system-ui';ctx.fillText('Press R to play again',W/2,H/2+25);ctx.textAlign='left';}
		}
		function loop(){update();draw();requestAnimationFrame(loop);} loop();
	</script>
</body>
</html>
Enjoy the game! Use the controls to navigate through the levels, collect coins, and reach the goal. Good luck!
